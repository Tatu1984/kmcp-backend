# MediaMTX for KMCP.
#
# Paths are not listed here. The API creates one per camera over the control API
# when a camera is registered or watched, named by that camera's random stream
# key — so this file is the server's policy, and the camera list lives in the
# database where the authority can edit it.
#
# The key is random rather than the camera's code because this path becomes a
# public URL. See the security section of README.md for what that does and does
# not buy.

logLevel: info

# ---------------------------------------------------------------- control API
# The API configures paths through this. Published to 127.0.0.1 only in
# docker-compose.yml: reachable over the private network or an SSH tunnel, never
# from the internet.
api: yes
apiAddress: :9997

# --------------------------------------------------------------------- ingest
# RTSP in, for the edge-push topology (see README, case B). Not needed at all
# when the gateway pulls cameras itself, and can be closed at the firewall then.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# Nothing else publishes here.
rtmp: no
srt: no

# -------------------------------------------------------------------- egress
# What the browser opens, both proxied by Caddy over TLS.
hls: yes
hlsAddress: :8888
# Low-latency HLS: a few seconds behind rather than fifteen, and still plays
# anywhere. The WebRTC path is there for sub-second when somebody needs it.
hlsVariant: lowLatency
hlsAlwaysRemux: no
# The portal fetches the playlist from a different origin, so it must be allowed
# to. This is a read of a stream that is already behind the portal's own
# authentication; the URL is the secret, and it names the gateway rather than a
# camera.
hlsAllowOrigin: '*'

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
# The one UDP port published in docker-compose.yml. Add a TURN server here if
# viewers sit behind a firewall that blocks UDP entirely.
webrtcLocalUDPAddress: :8189

# ---------------------------------------------------------------------- auth
# Two accounts, and neither is the default anonymous one.
#
# `read` is what Caddy presents when it proxies a viewer's request, so a stream
# cannot be pulled straight off this box by anyone who guesses a camera code.
# `publish` is for the edge agent in the push topology.
#
# Passwords come from the environment; see .env.example.
authInternalUsers:
  - user: read
    pass: changeme
    ips: []
    permissions:
      - action: read
      - action: playback

  - user: publish
    pass: changeme
    ips: []
    permissions:
      - action: publish

  # The control API authenticates by not being reachable, which is stronger than
  # a password on a port anyone can open.
  - user: any
    # Quoted: "::1" unquoted is not a YAML scalar, and MediaMTX refuses the
    # whole file rather than the line.
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
